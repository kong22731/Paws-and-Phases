<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Paws &amp; Phases — คำอธิบายโค้ด</title>
<style>
  @page { size: A4; margin: 15mm 14mm 16mm 14mm; }
  :root { --olive: #7a7d47; --olive-dark: #5d5f33; --olive-mid: #b2b579; --olive-light: #e3e5b8; --teal: #20a6b5; --teal-pale: #e6f8fa; --bg: #f3f4e6; --ink: #1f1f1f; --muted: #6b6b5a; }
  * { box-sizing: border-box; }
  body { font-family: 'Leelawadee UI', 'Leelawadee', 'Tahoma', sans-serif; color: var(--ink); font-size: 10.3pt; line-height: 1.6; margin: 0; }
  h1, h2, h3, h4 { line-height: 1.3; }
  .part { page-break-before: always; }
  .part-title { font-size: 21pt; color: var(--olive-dark); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 4px solid var(--olive); }
  .part-title span { display: inline-block; font-size: 10pt; background: var(--olive); color: #fff; border-radius: 999px; padding: 2px 12px; margin-right: 10px; vertical-align: middle; }
  h2 { font-size: 13.5pt; color: var(--olive-dark); margin: 22px 0 8px; padding: 6px 12px; background: var(--olive-light); border-left: 6px solid var(--olive); border-radius: 0 8px 8px 0; page-break-after: avoid; }
  h2.file { font-family: Consolas, 'Leelawadee UI', monospace; font-size: 13pt; }
  h2 small { font-family: 'Leelawadee UI', Tahoma, sans-serif; font-size: 9.5pt; font-weight: normal; color: var(--muted); margin-left: 8px; }
  h3 { font-size: 11.5pt; color: #2f3e1c; margin: 14px 0 5px; page-break-after: avoid; }
  h3::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--teal); border-radius: 2px; margin-right: 8px; vertical-align: middle; }
  h4 { font-size: 10.5pt; margin: 10px 0 4px; color: var(--olive-dark); }
  p { margin: 4px 0 8px; }
  code { font-family: Consolas, 'Courier New', monospace; font-size: 8.9pt; background: #eeeee2; padding: 0 4px; border-radius: 3px; color: #3b3d1c; }
  pre { font-family: Consolas, 'Courier New', monospace; font-size: 8.8pt; background: #2b2a1f; color: #f3f0d6; padding: 9px 12px; border-radius: 8px; margin: 6px 0 10px; white-space: pre-wrap; line-height: 1.45; page-break-inside: avoid; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; font-size: 9.5pt; }
  tr { page-break-inside: avoid; }
  th { background: var(--olive-mid); color: #fff; text-align: left; padding: 5px 8px; font-weight: 600; }
  td { border-bottom: 1px solid #e2e2d6; padding: 5px 8px; vertical-align: top; }
  td:first-child { width: 28%; }
  td code { font-size: 8.5pt; }
  ul, ol { margin: 4px 0 8px; padding-left: 22px; }
  li { margin: 2px 0; }
  li > ul, li > ol, li > table { margin-top: 3px; }
  .note { background: var(--teal-pale); border: 1px solid #a8dfe6; border-left: 5px solid var(--teal); border-radius: 8px; padding: 8px 12px; margin: 8px 0 12px; font-size: 9.8pt; page-break-inside: avoid; }
  .note b { color: #17707a; }
  .cover { height: 262mm; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--bg); border: 6px solid var(--olive); border-radius: 22px; }
  .cover .badge { background: var(--olive); color: #fff; padding: 4px 16px; border-radius: 999px; font-size: 10pt; letter-spacing: 2px; }
  .cover h1 { font-size: 40pt; margin: 18px 0 4px; color: var(--olive-dark); }
  .cover .sub { font-size: 16pt; color: var(--teal); margin-bottom: 26px; }
  .cover .pets { font-size: 48pt; margin: 4px 0 24px; }
  .cover .meta { color: var(--muted); font-size: 11pt; line-height: 1.9; }
  .diagram { display: grid; gap: 6px; margin: 10px 0 12px; page-break-inside: avoid; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .box { flex: 1; border: 2px solid var(--olive); border-radius: 10px; padding: 7px 9px; background: #fff; font-size: 9.2pt; }
  .box b { display: block; color: var(--olive-dark); font-size: 9.8pt; margin-bottom: 2px; }
  .box.ai { background: #f4f2dc; }
  .box.ui { background: #eef7f8; border-color: #5aaab4; }
  .box.ui b { color: #17707a; }
  .box.data { background: #f7efe6; border-color: #b8865a; }
  .box.data b { color: #94622f; }
  .arrow { text-align: center; color: var(--olive); font-size: 12pt; line-height: 1; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 12px; font-size: 9.3pt; }
  .flow span.s { background: var(--olive); color: #fff; border-radius: 8px; padding: 3px 10px; }
  .flow span.p { background: var(--olive-light); border-radius: 8px; padding: 3px 10px; }
  .toc li { margin: 4px 0; }
</style>
</head>
<body>
